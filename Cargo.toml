[package]
name = "feed-bench"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Latency benchmark for Robinhood Chain (Arbitrum Nitro, chain id 4663) transaction and block feeds"
license = "MIT"
publish = false

[[bin]]
name = "feedbench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha3 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hostname = "0.4"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
